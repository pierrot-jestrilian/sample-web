<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample Store — Menu & Pesan Online</title>
<meta name="description" content="Contoh desain toko kuliner dengan menu yang bisa dipesan lewat WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#16382B; --accent:#F2A81D; --paper:#F6F5F0; --white:#fff;
  --ink:#1B241F; --muted:#5C6760; --line:#DEDCD2; --danger:#B3261E;
  --head:"Fraunces",Georgia,serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px;padding-bottom:90px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);line-height:1.12}

/* header + hero */
.top{background:var(--dark);color:var(--white)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{font-family:var(--head);font-weight:800;font-size:22px}
.cartbtn{background:var(--accent);color:var(--dark);font-weight:700;padding:9px 16px;border-radius:999px;display:flex;gap:8px;align-items:center}
.cartbtn span{background:var(--dark);color:var(--white);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.hero{padding:36px 0 56px}
.hero h1{font-size:clamp(36px,7vw,60px);font-weight:800;max-width:15ch}
.hero p{margin:14px 0 22px;color:#CFE0D6;font-size:18px;max-width:44ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chips div{border:1px solid #3F6454;border-radius:999px;padding:6px 14px;font-size:14px;color:#CFE0D6}
.btn{display:inline-block;background:var(--accent);color:var(--dark);font-weight:700;padding:12px 24px;border-radius:10px;text-decoration:none}
.btn:hover{filter:brightness(.95)}

/* menu */
main{padding:40px 0}
h2{font-size:clamp(26px,5vw,36px);font-weight:800}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.tab{padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);font-weight:500}
.tab[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--white)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{height:130px;display:grid;place-items:center;font-size:56px;background:#E7EFE9}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:19px;font-weight:600}
.info p{color:var(--muted);font-size:15px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.price{font-weight:700;font-size:17px}
.add{background:var(--dark);color:var(--white);padding:8px 18px;border-radius:8px;font-weight:500}
.add:hover{background:#0F2A20}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--dark);border-radius:8px;overflow:hidden}
.step button{width:34px;height:34px;font-size:20px;font-weight:700}
.step button:hover{background:#E7EFE9}
.step b{min-width:30px;text-align:center}

/* cart bar + panel */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--dark);color:var(--white);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:20}
.bar.show{display:block}
.bar .in{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar strong{font-size:18px}
.bar button{background:var(--accent);color:var(--dark);font-weight:700;padding:10px 20px;border-radius:10px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30}
.veil.show{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--white);z-index:40;display:none;flex-direction:column}
.panel.show{display:flex}
.panel header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.panel header h2{font-size:24px}
.x{font-size:28px;line-height:1;padding:4px 10px}
.items{flex:1;overflow-y:auto;padding:8px 20px}
.it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.it small{color:var(--muted);display:block}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.form{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:10px}
.form input,.form textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
.form textarea{resize:vertical;min-height:60px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.send{background:#1F8F4E;color:var(--white);font-weight:700;padding:13px;border-radius:10px;text-align:center;text-decoration:none;display:block}
.send[aria-disabled="true"]{background:#9AA59E;pointer-events:none}

footer{background:var(--dark);color:#B7CBBF;padding:26px 0 calc(110px + env(safe-area-inset-bottom,0px));font-size:14px}
footer b{color:var(--white)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="nav">
      <div class="brand" id="brand"></div>
      <button class="cartbtn" id="openCart" aria-label="Buka keranjang">Keranjang <span id="count">0</span></button>
    </div>
    <div class="hero">
      <h1 id="heroName"></h1>
      <p id="tagline"></p>
      <a class="btn" href="#menu">Lihat Menu</a>
      <div class="chips"><div id="hours"></div><div id="addr"></div></div>
    </div>
  </div>
</div>

<main class="wrap" id="menu">
  <h2>Menu</h2>
  <div class="tabs" id="tabs" role="group" aria-label="Kategori menu"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap"><b id="fname"></b><br>Halaman ini contoh desain, dibuat oleh PeppercodeX.</div>
</footer>

<div class="bar" id="bar"><div class="in"><div><span id="barCount"></span><br><strong id="barTotal"></strong></div><button id="openCart2">Lihat Pesanan</button></div></div>
<div class="veil" id="veil"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-label="Keranjang pesanan">
  <header><h2>Pesanan Kamu</h2><button class="x" id="closeCart" aria-label="Tutup keranjang">&times;</button></header>
  <div class="items" id="items"></div>
  <div class="form">
    <input id="cname" placeholder="Nama kamu" autocomplete="name">
    <textarea id="cnote" placeholder="Catatan (misal: tidak pedas, alamat antar)"></textarea>
    <div class="total"><span>Total</span><span id="total"></span></div>
    <a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">Pesan lewat WhatsApp</a>
  </div>
</aside>

<script>
/* ============ EDIT BAGIAN INI SAJA ============ */
const STORE = {
  name: "Sample Store",
  tagline: "Masakan rumahan, dibuat segar dan diantar hangat ke tempat kamu.",
  wa: "6283872389131",            // nomor WhatsApp: format 62, tanpa + dan tanpa 0 di depan
  address: "Jl. Contoh No. 12, Tangerang",
  hours: "Buka setiap hari, 10.00 – 21.00",
  dark: "#16382B",               // warna utama
  accent: "#F2A81D"              // warna tombol
};
const MENU = [
  {id:1, cat:"Makanan", name:"Nasi Ayam Bakar", desc:"Ayam bakar bumbu kecap, nasi hangat, lalapan, sambal.", price:22000, emoji:"🍗", img:""},
  {id:2, cat:"Makanan", name:"Mie Goreng Spesial", desc:"Mie goreng telur, sayur, dan bakso.", price:18000, emoji:"🍜", img:""},
  {id:3, cat:"Makanan", name:"Ayam Geprek", desc:"Ayam crispy diulek dengan sambal level pilihan.", price:20000, emoji:"🍛", img:""},
  {id:4, cat:"Camilan", name:"Pangsit Goreng", desc:"Isi 6 pcs, renyah, saus sambal.", price:12000, emoji:"🥟", img:""},
  {id:5, cat:"Camilan", name:"Kentang Goreng", desc:"Porsi besar dengan bumbu tabur.", price:14000, emoji:"🍟", img:""},
  {id:6, cat:"Minuman", name:"Es Teh Manis", desc:"Teh segar, manisnya pas.", price:5000, emoji:"🧋", img:""},
  {id:7, cat:"Minuman", name:"Es Jeruk", desc:"Jeruk peras asli.", price:8000, emoji:"🍋", img:""},
  {id:8, cat:"Minuman", name:"Kopi Susu", desc:"Kopi susu gula aren, dingin atau panas.", price:15000, emoji:"☕", img:""}
];
/* ============ SELESAI. JANGAN UBAH DI BAWAH ============ */

const $ = id => document.getElementById(id);
const rp = n => "Rp" + n.toLocaleString("id-ID");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cart = {};
let activeCat = "Semua";

document.documentElement.style.setProperty("--dark", STORE.dark);
document.documentElement.style.setProperty("--accent", STORE.accent);
document.title = STORE.name + " — Menu & Pesan Online";
$("brand").textContent = STORE.name;
$("heroName").textContent = STORE.name;
$("fname").textContent = STORE.name;
$("tagline").textContent = STORE.tagline;
$("hours").textContent = STORE.hours;
$("addr").textContent = STORE.address;

function ctl(id){
  const q = cart[id] || 0;
  if(!q) return '<button class="add" data-act="add" data-id="'+id+'">Tambah</button>';
  return '<div class="step"><button data-act="dec" data-id="'+id+'" aria-label="Kurangi">&minus;</button><b>'+q+'</b><button data-act="inc" data-id="'+id+'" aria-label="Tambah">+</button></div>';
}
function renderTabs(){
  const cats = ["Semua"].concat([...new Set(MENU.map(m => m.cat))]);
  $("tabs").innerHTML = cats.map(c => '<button class="tab" data-cat="'+esc(c)+'" aria-pressed="'+(c===activeCat)+'">'+esc(c)+'</button>').join("");
}
function renderGrid(){
  const list = MENU.filter(m => activeCat==="Semua" || m.cat===activeCat);
  $("grid").innerHTML = list.map(m =>
    '<article class="card"><div class="pic">'+(m.img ? '<img src="'+esc(m.img)+'" alt="'+esc(m.name)+'" loading="lazy">' : '<span aria-hidden="true">'+m.emoji+'</span>')+'</div>'+
    '<div class="info"><h3>'+esc(m.name)+'</h3><p>'+esc(m.desc)+'</p>'+
    '<div class="row"><span class="price">'+rp(m.price)+'</span><span id="ctl-'+m.id+'">'+ctl(m.id)+'</span></div></div></article>'
  ).join("");
}
function totals(){
  let n=0, t=0;
  MENU.forEach(m => { const q = cart[m.id]||0; n+=q; t+=q*m.price; });
  return {n, t};
}
function renderCart(){
  const {n,t} = totals();
  $("count").textContent = n;
  $("total").textContent = rp(t);
  $("bar").classList.toggle("show", n>0);
  $("barCount").textContent = n + " item";
  $("barTotal").textContent = rp(t);
  const rows = MENU.filter(m => cart[m.id]);
  $("items").innerHTML = rows.length ? rows.map(m =>
    '<div class="it"><div><b>'+esc(m.name)+'</b><small>'+rp(m.price)+' x '+cart[m.id]+' = '+rp(m.price*cart[m.id])+'</small></div>'+
    '<div class="step"><button data-act="dec" data-id="'+m.id+'" aria-label="Kurangi '+esc(m.name)+'">&minus;</button><b>'+cart[m.id]+'</b><button data-act="inc" data-id="'+m.id+'" aria-label="Tambah '+esc(m.name)+'">+</button></div></div>'
  ).join("") : '<div class="empty">Belum ada pesanan. Pilih menu dulu ya.</div>';
  buildLink();
}
function buildLink(){
  const {n,t} = totals();
  const a = $("send");
  if(!n){ a.setAttribute("aria-disabled","true"); a.href="#"; return; }
  let msg = "Halo " + STORE.name + ", saya mau pesan:\n";
  MENU.forEach(m => { if(cart[m.id]) msg += "- " + cart[m.id] + "x " + m.name + " (" + rp(m.price*cart[m.id]) + ")\n"; });
  msg += "\nTotal: " + rp(t);
  const nm = $("cname").value.trim(), nt = $("cnote").value.trim();
  if(nm) msg += "\nNama: " + nm;
  if(nt) msg += "\nCatatan: " + nt;
  a.href = "https://wa.me/" + STORE.wa + "?text=" + encodeURIComponent(msg);
  a.removeAttribute("aria-disabled");
}
function change(id, act){
  const cur = cart[id] || 0;
  const next = act==="dec" ? Math.max(0, cur-1) : cur+1;
  if(next) cart[id] = next; else delete cart[id];
  const slot = $("ctl-"+id);
  if(slot) slot.innerHTML = ctl(id);
  renderCart();
  // kembalikan fokus ke tombol yang relevan
  const root = $("panel").classList.contains("show") ? $("items") : slot;
  const target = root && root.querySelector('button[data-id="'+id+'"][data-act="'+(next?act==="dec"&&next?"dec":"inc":"add")+'"]') || (root && root.querySelector('button[data-id="'+id+'"]'));
  if(target) target.focus();
}
function openCart(){ $("panel").classList.add("show"); $("veil").classList.add("show"); $("closeCart").focus(); }
function closeCart(){ $("panel").classList.remove("show"); $("veil").classList.remove("show"); $("openCart").focus(); }

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.cat){ activeCat = b.dataset.cat; renderTabs(); renderGrid(); return; }
  if(b.dataset.act){ change(+b.dataset.id, b.dataset.act==="add" ? "inc" : b.dataset.act); }
});
$("openCart").onclick = openCart;
$("openCart2").onclick = openCart;
$("closeCart").onclick = closeCart;
$("veil").onclick = closeCart;
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("panel").classList.contains("show")) closeCart(); });
$("cname").addEventListener("input", buildLink);
$("cnote").addEventListener("input", buildLink);

renderTabs(); renderGrid(); renderCart();
</script>
</body>
</html>
